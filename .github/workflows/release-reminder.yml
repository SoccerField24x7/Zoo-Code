name: Post weekly release reminder

# Requires two repo secrets:
# - DISCORD_RELEASE_WEBHOOK_URL: Discord webhook for the channel that receives
#   the reminder. The reminder job fails (noisily) if it is unset.
# - DISCORD_RELEASE_MAINTAINERS: space-separated Discord user mentions in the
#   <@USER_ID> form, for example "<@123456789012345678> <@987654321098765432>".
#   Use numeric user IDs, not @handles. Only the <@USER_ID> form pings the user.
#   If it is unset, the reminder uses a generic "Maintainers" greeting.

on:
    schedule:
        # Friday at 09:00 UTC
        - cron: "0 9 * * 5"
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-reminder
    # A re-run produces an identical message, so cancel a stale/duplicate run
    # rather than risk posting twice.
    cancel-in-progress: true

jobs:
    remind:
        runs-on: ubuntu-latest
        steps:
            - name: Post release reminder to Discord
              env:
                  DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
                  DISCORD_RELEASE_MAINTAINERS: ${{ secrets.DISCORD_RELEASE_MAINTAINERS }}
              run: |
                  set -euo pipefail
                  maintainers="${DISCORD_RELEASE_MAINTAINERS:-Maintainers}"

                  message=$(cat <<EOF
                  **Weekly release reminder**

                  ${maintainers} — Roomote prepares this week's Zoo Code release today at 7:00pm ET and posts the release PR in this channel.

                  When the release PR is up:

                  1. Review and approve the release PR.
                  2. Tag the release branch tip (\`v[version]\`) to trigger the Marketplace publish workflow.
                  3. Approve the deployment when the \`marketplace-production\` environment requests it.
                  4. After publishing succeeds, add the release PR to the merge queue.

                  Avoid merging or rebasing the release branch before publishing, so the approved tag keeps the intended commit SHA.

                  More detail: https://discord.com/channels/1497384592494297201/1498024845945081999/1512914847124291667
                  EOF
                  )

                  payload=$(jq -n --arg content "$message" '{content: $content}')
                  curl --fail-with-body --silent --show-error \
                    --header 'Content-Type: application/json' \
                    --data "$payload" \
                    "$DISCORD_RELEASE_WEBHOOK_URL"

            - name: Notify on failure
              if: failure()
              env:
                  DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
              run: |
                  set -euo pipefail
                  payload=$(jq -nc --arg content "⚠️ release-reminder workflow failed — see the Actions runs." '{content: $content}')
                  curl --fail-with-body --silent --show-error \
                    --header 'Content-Type: application/json' \
                    --data "$payload" \
                    "$DISCORD_RELEASE_WEBHOOK_URL" || true
